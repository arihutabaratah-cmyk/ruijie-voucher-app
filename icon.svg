<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#gradBg)"/>
  
  <!-- Ticket / Voucher Body -->
  <g transform="translate(64, 96)">
    <!-- Ticket Shadow -->
    <rect x="12" y="12" width="360" height="296" rx="28" fill="#000000" opacity="0.25"/>
    
    <!-- Ticket Main -->
    <rect x="0" y="0" width="360" height="296" rx="24" fill="#ffffff"/>
    
    <!-- Header Top Strip -->
    <path d="M 0 24 A 24 24 0 0 1 24 0 L 336 0 A 24 24 0 0 1 360 24 L 360 70 L 0 70 Z" fill="url(#gradGold)"/>
    <text x="180" y="46" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="2">WIFI HOTSPOT</text>
    
    <!-- Semi-Circle Punch Notches -->
    <circle cx="0" cy="190" r="22" fill="#1e1b4b"/>
    <circle cx="360" cy="190" r="22" fill="#1e1b4b"/>
    
    <!-- Dashed Tear Line -->
    <line x1="30" y1="190" x2="330" y2="190" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="10 8"/>
    
    <!-- WiFi Signal Icon Center -->
    <g transform="translate(180, 126)" stroke="#2563eb" stroke-width="12" stroke-linecap="round" fill="none">
      <path d="M -50 -18 A 60 60 0 0 1 50 -18"/>
      <path d="M -30 2 A 38 38 0 0 1 30 2"/>
      <path d="M -12 20 A 18 18 0 0 1 12 20"/>
      <circle cx="0" cy="36" r="6" fill="#2563eb" stroke="none"/>
    </g>
    
    <!-- Code Box Bottom -->
    <rect x="40" y="215" width="280" height="56" rx="14" fill="#f1f5f9" stroke="#93c5fd" stroke-width="2"/>
    <text x="180" y="252" fill="#1e40af" font-family="'Courier New', monospace" font-size="28" font-weight="900" text-anchor="middle" letter-spacing="4">RJ-8899</text>
  </g>
</svg>
